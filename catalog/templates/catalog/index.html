<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog</title>
    <style>
        :root {
            --bg: #f4f5f7;
            --surface: #ffffff;
            --border: #e5e7eb;
            --border-strong: #d1d5db;
            --text: #1f2937;
            --text-soft: #374151;
            --text-muted: #6b7280;
            --text-inverse: #ffffff;
            --accent: #4f46e5;
            --accent-soft: #eef2ff;
            --accent-border: #d6d9ff;
            --danger: #ef4444;
            --danger-soft: #fef2f2;
            --surface-muted: #f3f4f6;
            --radius: 14px;
            --shadow-sm: 0 1px 2px rgba(16, 24, 40, .05);
            --shadow-md: 0 4px 12px rgba(16, 24, 40, .08);
            --shadow-lg: 0 12px 32px rgba(16, 24, 40, .14);
            --shadow-up: 0 -8px 24px rgba(16, 24, 40, .10);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .app-header {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 18px;
        }

        .brand-mark {
            display: grid;
            place-items: center;
            width: 32px;
            height: 32px;
            border-radius: 9px;
            background: var(--accent);
            color: var(--text-inverse);
            font-weight: 800;
        }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 560px;
            padding: 10px 10px;
        }

        .search-box .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .search-box input {
            width: 100%;
            padding: 11px 40px 11px 42px;
            font-size: 15px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }

        .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-soft);
        }

        .search-clear {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: color .15s, background .15s;
        }

        .search-clear:hover {
            background: var(--border);
            color: var(--text);
        }

        .search-clear[hidden] {
            display: none;
        }

        .container {
            max-width: 1180px;
            margin: 0 auto;
            padding: 24px 24px 140px;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .select {
            padding: 9px 12px;
            font-size: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            color: var(--text);
            outline: none;
            cursor: pointer;
        }

        .select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-soft);
        }

        .tags-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            font-size: 13px;
            font-weight: 500;
            line-height: 1.4;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-muted);
            cursor: pointer;
            transition: all .15s;
        }

        .pill:hover { border-color: var(--accent); color: var(--accent); }

        .pill--active {
            background: var(--accent);
            color: var(--text-inverse);
            border-color: var(--accent);
        }

        .pill--active:hover { border-color: var(--accent); color: var(--text-inverse); }

        .pill--muted {
            background: var(--surface-muted);
            border-color: transparent;
            color: var(--text-soft);
            cursor: default;
        }

        .pill--muted:hover { border-color: transparent; color: var(--text-soft); }

        .pill--accent {
            background: var(--accent-soft);
            border-color: transparent;
            color: var(--accent);
            font-weight: 600;
        }

        .pill--accent:hover { border-color: transparent; color: var(--accent); }

        .pill--danger {
            background: transparent;
            border-color: transparent;
            color: var(--danger);
            font-weight: 600;
        }

        .pill--danger:hover {
            background: var(--danger-soft);
            border-color: transparent;
            color: var(--danger);
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        #result-count {
            margin: 0;
            font-size: 14px;
            color: var(--text-muted);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        .product-card {
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 18px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: transform .15s, box-shadow .15s, border-color .15s;
        }

        .product-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: var(--accent-border);
        }

        .product-card.selected {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-md);
        }

        .card-body {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-check {
            position: absolute;
            top: 14px;
            right: 14px;
            display: grid;
            place-items: center;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid var(--border-strong);
            color: transparent;
            transition: all .15s;
        }

        .product-card.selected .card-check {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--text-inverse);
        }

        .card-name {
            margin: 0 0 4px;
            font-size: 16px;
            font-weight: 650;
            padding-right: 30px;
        }

        .card-badge {
            align-self: flex-start;
            margin-bottom: 10px;
            cursor: default;
        }

        .card-desc {
            margin: 0 0 12px;
            font-size: 14px;
            color: var(--text-muted);
            overflow: hidden;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: auto;
            padding-top: 12px;
        }

        .selected-tray {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 30;
            padding: 14px 24px calc(14px + env(safe-area-inset-bottom));
            background: var(--surface);
            border-top: 1px solid var(--border);
            box-shadow: var(--shadow-up);
            animation: slideUp .2s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .tray-inner {
            max-width: 1180px;
            margin: 0 auto;
        }

        .tray-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .tray-title {
            font-size: 14px;
            font-weight: 650;
        }

        .tray-items {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        #sentinel {
            height: 1px;
        }

        @media (max-width: 640px) {
            .app-header { flex-direction: column; align-items: stretch; }
            .search-box { max-width: none; }
            .container { padding: 16px 16px 150px; }
        }
    </style>
</head>

<body>
    <header class="app-header">
        <div class="brand"><span class="brand-mark">C</span> Catalog</div>
        <div class="search-box">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
            <input type="text" id="q" placeholder="Search name or description..." autocomplete="off">
            <button type="button" class="search-clear" id="search-clear" aria-label="Clear search" hidden>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
            </button>
        </div>
        <div class="brand">Alex Bepple</div>
    </header>

    <main class="container">
        <div class="filters">
            <select id="category-select" class="select">
                <option value="">All Categories</option>
            </select>
            <div class="tags-wrap" id="tags-container"></div>
        </div>

        <div class="toolbar">
            <p id="result-count"></p>
        </div>

        <div class="grid" id="results-grid"></div>

        <div id="sentinel"></div>
    </main>

    <footer class="selected-tray" id="selected-tray" hidden>
        <div class="tray-inner">
            <div class="tray-header">
                <span class="tray-title"><span id="selected-count">0</span> selected</span>
                <button class="pill pill--danger" id="clear-selection">Clear</button>
            </div>
            <div class="tray-items" id="tray-items"></div>
        </div>
    </footer>

    <script>
        const state = {
            query: '',
            categoryId: '',
            selectedTags: new Set(),
            page: 1,
            hasNext: true,
            loading: false,
            selectedProducts: new Map(),
        };

        let productsAbortController = null;
        let tagsAbortController = null;
        let debounceTimer = null;

        const qInput = document.getElementById('q');
        const searchClear = document.getElementById('search-clear');
        const categorySelect = document.getElementById('category-select');
        const tagsContainer = document.getElementById('tags-container');
        const resultsGrid = document.getElementById('results-grid');
        const resultCount = document.getElementById('result-count');
        const selectedTray = document.getElementById('selected-tray');
        const trayItems = document.getElementById('tray-items');
        const selectedCount = document.getElementById('selected-count');
        const clearSelectionBtn = document.getElementById('clear-selection');

        let localTagsCache = [];
        
        function debounce(fn, delay) {
            return (...args) => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => fn(...args), delay);
            };
        }

        async function loadTags() {
            if (tagsAbortController) tagsAbortController.abort();
            tagsAbortController = new AbortController();

            const params = new URLSearchParams();
            if (state.categoryId) params.set('category', state.categoryId);
            if (state.query) params.set('q', state.query);

            try {
                const res = await fetch('/api/tags/?' + params.toString(), {
                    signal: tagsAbortController.signal,
                });
                const data = await res.json();
                localTagsCache = data.tags;
                renderPills(localTagsCache);
            } catch (err) {
                if (err.name !== 'AbortError') throw err;
            }
        }

        function renderPills(tags) {
            tagsContainer.innerHTML = '';

            // default clear selected pills pill
            if (state.selectedTags.size > 0) {
                const clearPill = document.createElement('span');
                clearPill.className = 'pill pill--danger';
                clearPill.textContent = `Clear ${state.selectedTags.size}`;
                clearPill.addEventListener('click', clearTags);
                tagsContainer.appendChild(clearPill);
            }

            // The rest of em
            tags.forEach(tag => {
                const pill = document.createElement('span');
                const isSelected = state.selectedTags.has(String(tag.id));
                pill.className = 'pill' + (isSelected ? ' pill--active' : '');
                pill.textContent = tag.name;
                pill.dataset.tagId = tag.id;
                pill.addEventListener('click', () => toggleTag(String(tag.id)));
                tagsContainer.appendChild(pill);
            });
        }

        function toggleTag(tagId) {
            if (state.selectedTags.has(tagId)) {
                state.selectedTags.delete(tagId);
            } else {
                state.selectedTags.add(tagId);
            }
            renderPills(localTagsCache);
            resetAndReload({ refreshPills: false });
        }

        function clearTags() {
            if (!state.selectedTags.size) return;
            state.selectedTags.clear();
            renderPills(localTagsCache);
            resetAndReload({ refreshPills: false });
        }

        function createCard(p) {
            const id = String(p.id);
            const isSelected = state.selectedProducts.has(id);

            const card = document.createElement('article');
            card.className = 'product-card' + (isSelected ? ' selected' : '');
            card.dataset.productId = id;
            card.setAttribute('role', 'button');
            card.setAttribute('tabindex', '0');
            card.setAttribute('aria-pressed', isSelected ? 'true' : 'false');
            card.innerHTML = `
                <span class="card-check" aria-hidden="true">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
                </span>
                <div class="card-body">
                    <h3 class="card-name">${p.name}</h3>
                    <span class="pill pill--accent card-badge">${p.category || 'Uncategorized'}</span>
                    <p class="card-desc">${p.description}</p>
                    <div class="card-tags">${
                        p.tags.map(t => `<span class="pill pill--muted">${t}</span>`).join('')
                        }</div>
                </div>
            `;
            card.addEventListener('click', () => toggleProduct(p));
            card.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleProduct(p);
                }
            });
            return card;
        }

        function toggleProduct(p) {
            const id = String(p.id);
            if (state.selectedProducts.has(id)) {
                state.selectedProducts.delete(id);
            } else {
                state.selectedProducts.set(id, p);
            }
            updateCardSelection(id);
            renderTray();
        }

        function updateCardSelection(id) {
            const selected = state.selectedProducts.has(id);
            const card = resultsGrid.querySelector(`[data-product-id="${CSS.escape(id)}"]`);
            if (card) {
                card.classList.toggle('selected', selected);
                card.setAttribute('aria-pressed', selected ? 'true' : 'false');
            }
        }

        function renderTray() {
            const items = [...state.selectedProducts.values()];
            selectedCount.textContent = items.length;
            trayItems.innerHTML = '';

            items.forEach(p => {
                const chip = document.createElement('span');
                chip.className = 'pill pill--accent';
                chip.textContent = p.name;
                chip.addEventListener('click', () => toggleProduct(p));
                trayItems.appendChild(chip);
            });

            selectedTray.hidden = items.length === 0;
        }

        function clearSelection() {
            const ids = [...state.selectedProducts.keys()];
            state.selectedProducts.clear();
            ids.forEach(id => updateCardSelection(id));
            renderTray();
        }

        async function loadProducts(append = false) {
            if (productsAbortController) productsAbortController.abort();
            const controller = new AbortController();
            productsAbortController = controller;

            const params = new URLSearchParams();
            if (state.query) params.set('q', state.query);
            if (state.categoryId) params.set('category', state.categoryId);
            state.selectedTags.forEach(id => params.append('tags', id));
            params.set('page', state.page);

            state.loading = true;

            try {
                const res = await fetch('/api/products/?' + params.toString(), {
                    signal: controller.signal,
                });
                const data = await res.json();

                if (!append) {
                    resultsGrid.innerHTML = '';
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }

                const frag = document.createDocumentFragment();
                data.products.forEach(p => frag.appendChild(createCard(p)));
                resultsGrid.appendChild(frag);

                state.hasNext = data.has_next;
                resultCount.textContent = data.count
                    ? `${data.count} results`
                    : 'No results';
            } catch (err) {
                if (err.name !== 'AbortError') throw err;
            } finally {
                if (productsAbortController === controller) {
                    state.loading = false;
                    fillViewportIfNeeded();
                }
            }
        }

        function resetAndReload({ refreshPills = true } = {}) {
            state.page = 1;
            state.hasNext = true;
            loadProducts(false);
            if (refreshPills) {
                loadTags();
            }
        }

        function applySearch() {
            state.query = qInput.value.trim();
            state.selectedTags.clear();
            resetAndReload({ refreshPills: true });
        }

        const debouncedSearch = debounce(applySearch, 300);

        function updateSearchClear() {
            searchClear.hidden = qInput.value.length === 0;
        }

        qInput.addEventListener('input', () => {
            updateSearchClear();
            debouncedSearch();
        });

        searchClear.addEventListener('click', () => {
            qInput.value = '';
            updateSearchClear();
            applySearch();
            qInput.focus();
        });

        async function loadCategories() {
            const res = await fetch('/api/categories/');
            const data = await res.json();
            data.categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat.id;
                opt.textContent = cat.name;
                categorySelect.appendChild(opt);
            });
        }

        categorySelect.addEventListener('change', () => {
            state.categoryId = categorySelect.value;
            state.selectedTags.clear();
            resetAndReload({ refreshPills: true });
        });

        const sentinel = document.getElementById('sentinel');

        function loadNextPage() {
            if (state.loading || !state.hasNext) return;
            state.page += 1;
            loadProducts(true);
        }

        function fillViewportIfNeeded() {
            if (!sentinel || state.loading || !state.hasNext) return;
            const rect = sentinel.getBoundingClientRect();
            if (rect.top < window.innerHeight + 100) {
                loadNextPage();
            }
        }

        const observer = new IntersectionObserver((entries) => {
            if (entries.some(entry => entry.isIntersecting)) {
                loadNextPage();
            }
        }, { rootMargin: '100px' });

        if (sentinel) observer.observe(sentinel);

        clearSelectionBtn.addEventListener('click', clearSelection);

        loadTags();
        loadCategories();
        loadProducts(false);
    </script>
</body>

</html>
